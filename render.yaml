services:
  - type: web
    name: resume-ai-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: DB_URL            # jdbc:mysql://HOST:PORT/defaultdb?sslMode=REQUIRED
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS      # your frontend URL, e.g. https://your-app.netlify.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
