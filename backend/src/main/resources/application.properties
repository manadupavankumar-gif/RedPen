# ---------- Server ----------
spring.profiles.default=local
server.port=${PORT:8080}

# ---------- MySQL / Aiven ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

# ---------- Groq AI ----------
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

groq.model=openai/gpt-oss-120b
groq.fallback-model=openai/gpt-oss-20b
groq.reasoning-effort=low

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=31536000000

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ORIGINS:*}

# ---------- Limits ----------
app.limits.daily-analyses=${DAILY_LIMIT:20}
app.limits.ai-tools-per-hour=40
app.limits.new-sessions-per-hour-per-ip=10

# ---------- Proxy ----------
server.forward-headers-strategy=native
