# Local runs use src/main/resources/application-local.properties (git-ignored, holds your
# local DB password). In the cloud, everything secret comes from environment variables.
spring.profiles.default=local

# Cloud platforms inject PORT; locally it stays 8080.
server.port=${PORT:8080}

# ---------- MySQL ----------
# The database "resume_ai" is created automatically on first run.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resume_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Uploads ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB

# ---------- Groq AI (OpenAI-compatible, very fast inference) ----------
# Put your NEW Groq key after the colon for local runs, or set the GROQ_API_KEY environment variable.
# Never commit a real key to GitHub.
groq.api.key=${GROQ_API_KEY:PASTE_YOUR_GROQ_KEY_HERE}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
# Groq retired llama-3.3-70b-versatile and llama-3.1-8b-instant, so we use GPT-OSS now.
# groq.model is tried first; if Groq says that model is unavailable, groq.fallback-model is used.
groq.model=openai/gpt-oss-120b
groq.fallback-model=openai/gpt-oss-20b
# low = fastest answers (GPT-OSS models think before answering; low keeps that short)
groq.reasoning-effort=low

# ---------- Browser identity token (JWT) ----------
# Each browser gets a token on first visit and keeps its saved scores under it for a year.
# Keep this secret (32+ characters) stable: changing it makes every browser start with an empty history.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=31536000000

# ---------- CORS ----------
# Which website addresses may call this API. "*" = any. In production set CORS_ORIGINS
# to your frontend address, e.g. https://resume.example.com (comma-separate several).
app.cors.allowed-origins=${CORS_ORIGINS:*}

# ---------- Limits (protects your Groq quota) ----------
# Scores per browser per day (resets at midnight UTC). Cached repeats do not count.
app.limits.daily-analyses=${DAILY_LIMIT:20}
# Rewrites, cover letters and interview questions per user per hour
app.limits.ai-tools-per-hour=40

# New browser sessions allowed per network address per hour (anti-abuse)
app.limits.new-sessions-per-hour-per-ip=10
# Behind nginx / a proxy: use the real visitor address for the limit above
server.forward-headers-strategy=native
